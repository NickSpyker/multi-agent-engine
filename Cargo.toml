[workspace]
resolver = "2"
members = [
    # Workspace Crates
    "crates/multi-agent-engine-core",
    "crates/multi-agent-engine-gpu",
    "crates/multi-agent-engine-runtime",
    "crates/multi-agent-engine-sync",
    # Published Library
    "multi-agent-engine",
    # Internal
    "examples",
    "benches",
]

[workspace.package]
version = "0.1.0"
authors = ["Nicolas Spijkerman <nicospijke@gmail.com>"]
categories = ["simulation"]
description = "A concurrent Rust library for building multi-agent systems with lock-free CPU/GPU hybrid execution"
documentation = "https://github.com/NickSpyker/multi-agent-engine/blob/main/docs/documentation.md"
edition = "2024"
homepage = "https://github.com/NickSpyker/multi-agent-engine/blob/main/README.md"
keywords = ["engine", "simulation", "multi-agent", "concurrent", "gpu"]
license = "MIT or Apache-2.0"
publish = true
readme = "README.md"
repository = "https://github.com/NickSpyker/multi-agent-engine"

[workspace.dependencies]
# Workspace Crates
multi-agent-engine-core = { path = "crates/multi-agent-engine-core" }
multi-agent-engine-gpu = { path = "crates/multi-agent-engine-gpu" }
multi-agent-engine-runtime = { path = "crates/multi-agent-engine-runtime" }
multi-agent-engine-sync = { path = "crates/multi-agent-engine-sync" }
# Common
# Core
# Gpu
# Runtime
# Sync
crossbeam-channel = { version = "0.5.15", features = ["default"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev.package."*"]
opt-level = 2
